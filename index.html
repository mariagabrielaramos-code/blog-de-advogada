<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Gabriela | Advocacia & Consultoria Jurídica</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* Variáveis de Cores */
        :root {
            --primary: #0d233a;     /* Azul Marinho Nobre */
            --secondary: #c5a059;   /* Dourado Elegante */
            --text-dark: #2c3e50;   /* Cinza Escuro para Leitura */
            --bg-light: #f8f9fa;    /* Fundo Suave */
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* NAVEGAÇÃO */
        nav {
            background-color: var(--primary);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid var(--secondary);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            margin: 0 15px;
            font-weight: 400;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--secondary);
        }

        /* CABEÇALHO / HERO */
        header {
            background: linear-gradient(rgba(13, 35, 58, 0.9), rgba(13, 35, 58, 0.9)), 
                        url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            color: var(--white);
            padding: 80px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            color: #d1d5db;
            max-width: 600px;
            margin: 0 auto 25px auto;
            font-weight: 300;
        }

        /* BOTÃO DE AÇÃO */
        .btn-contact {
            display: inline-block;
            background-color: var(--secondary);
            color: var(--white);
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-contact:hover {
            background-color: #b08d48;
            transform: translateY(-2px);
        }

        /* CONTEÚDO PRINCIPAL */
        main {
            flex: 1;
            max-width: 900px;
            width: 90%;
            margin: 40px auto;
        }
